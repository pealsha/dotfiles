# Ubuntu 24.04 / tmux 3.4. Keep work running across SSH disconnections.
set -g default-terminal "tmux-256color"

# Accept OSC 52 from Neovim and relay it to the attached terminal.
# The outer terminal must support OSC 52; see docs/miniPC.md for diagnostics.
set -s set-clipboard on
set -ga update-environment " SSH_TTY"

# Terminal-specific overrides stay on each machine.
source-file -q ~/.tmux.conf.local
